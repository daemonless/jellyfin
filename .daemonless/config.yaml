icon: ':simple-jellyfin:'
cit:
  mode: screenshot
  port: 8096
  wait: 300
  ready: "Startup complete"
  screenshot_wait: 10
  annotations:
    - org.freebsd.jail.allow.mlock=true

build:
  variants:
    # no quarterly build: jellyfin-ffmpeg7 pkg is latest-only
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"
      aliases: ["latest", "pkg"]
      default: true
      tag_desc: "**FreeBSD Latest**. Jellyfin plus the jellyfin-ffmpeg7 package (not in quarterly)."
